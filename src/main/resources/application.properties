# CONFIGURACIÓN DE LA BASE DE DATOS (Conectada a 'tutorias')
spring.datasource.url=jdbc:mysql://localhost:3306/tutorias?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true

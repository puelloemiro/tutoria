<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>EJEMPLO DE CRUD MVC CON SPRING BOOT</title>
    <meta charset="UTF-8">
</head>
<body>
<h2>PÁGINA DE INICIO</h2>

<a th:href="@{/agregar}">AGREGAR USUARIO</a>

<h4>LISTA DE PERSONAS</h4>
<hr>

<div th:if="${usuarios != null and !usuarios.empty}">
    <table border="1">
        <tr>
            <th>CÉDULA</th>
            <th>CLAVE</th>
            <th>NOMBRE</th>
            <th>EMAIL</th>
            <th>ACCIONES</th>
        </tr>
        <tr th:each="u: ${usuarios}">
            <td th:text="${u.cedula}"></td>
            <td th:text="${u.clave}"></td>
            <td th:text="${u.nombre}"></td>
            <td th:text="${u.email}"></td>
            <td>
                <a th:href="@{/editar/} + ${u.cedula}">Editar</a> |
                <a th:href="@{/eliminar/} + ${u.cedula}"
                   onclick="return confirm('¿Seguro que deseas eliminar este usuario?');">Eliminar</a>
            </td>
        </tr>
    </table>
</div>

<div th:if="${usuarios == null or usuarios.empty}">
    <p>La lista de usuarios está vacía.</p>
</div>
</body>
</html>

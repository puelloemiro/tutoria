<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Gestión de Usuarios</title>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="#">Sistema Tutorías</a>
        <div class="navbar-nav">
            <a class="nav-link active" th:href="@{/}">Usuarios</a>
            <a class="nav-link" th:href="@{/tutorias}">Tutorías</a>
        </div>
    </div>
</nav>

<div class="container">
    <div class="card shadow-sm p-4 mb-4 bg-white rounded">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="text-secondary m-0">Control de Usuarios</h2>
            <a th:href="@{/agregar}" class="btn btn-primary">+ Agregar Usuario</a>
        </div>
        <hr>

        <div th:if="${usuarios != null and !usuarios.empty}" class="table-responsive">
            <table class="table table-striped table-hover align-middle border">
                <thead class="table-dark">
                <tr>
                    <th>CÉDULA</th>
                    <th>CLAVE</th>
                    <th>NOMBRE</th>
                    <th>EMAIL</th>
                    <th class="text-center">ACCIONES</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="u: ${usuarios}">
                    <td th:text="${u.cedula}" class="fw-bold text-muted"></td>
                    <td>•••••••</td> <td th:text="${u.nombre}"></td>
                    <td th:text="${u.email}"></td>
                    <td class="text-center">
                        <a th:href="@{/editar/} + ${u.cedula}" class="btn btn-sm btn-warning me-1">Editar</a>
                        <a th:href="@{/eliminar/} + ${u.cedula}"
                           class="btn btn-sm btn-danger"
                           onclick="return confirm('¿Seguro que deseas eliminar este usuario?');">Eliminar</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div th:if="${usuarios == null or usuarios.empty}" class="alert alert-warning text-center">
            La lista de usuarios está vacía.
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Gestión de Tutorías</title>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="#">Sistema Tutorías</a>
        <div class="navbar-nav">
            <a class="nav-link" th:href="@{/}">Usuarios</a>
            <a class="nav-link active" th:href="@{/tutorias}">Tutorías</a>
        </div>
    </div>
</nav>

<div class="container-fluid px-4">
    <div class="card shadow-sm p-4 mb-4 bg-white rounded">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="text-secondary m-0">Panel de Tutorías Registradas</h2>
            <a th:href="@{/tutorias/agregar}" class="btn btn-success">+ Registrar Tutoría</a>
        </div>
        <hr>

        <div th:if="${tutorias != null and !tutorias.empty}" class="table-responsive">
            <table class="table table-striped table-hover align-middle border text-nowrap">
                <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>FECHA REG.</th>
                    <th>FECHA PROG.</th>
                    <th>HORARIO</th>
                    <th>DOCENTE</th>
                    <th>ESTUDIANTE</th>
                    <th>UNIVERSIDAD / CARRERA</th>
                    <th>ASIGNATURA (TEMÁTICA)</th>
                    <th>MODALIDAD</th>
                    <th>LUGAR</th>
                    <th>COMPROMISOS</th>
                    <th class="text-center">ACCIONES</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="t : ${tutorias}">
                    <td th:text="${t.id}" class="fw-bold"></td>
                    <td th:text="${t.fecha}"></td>
                    <td th:text="${t.fechaProgramada}"></td>
                    <td th:text="${t.horaInicio} + ' a ' + ${t.horaFin}" class="text-primary fw-medium"></td>
                    <td th:text="${t.docente}"></td>
                    <td th:text="${t.estudiante}"></td>
                    <td th:text="${t.universidad} + ' - ' + ${t.carrera}"></td>
                    <td th:text="${t.asignatura} + ' (' + ${t.tematica} + ')'"></td>
                    <td>
                                <span th:text="${t.esGrupalOIndividual}"
                                      th:class="${t.esGrupalOIndividual == 'Individual' ? 'badge bg-info text-dark' : 'badge bg-purple text-wrap bg-primary'}">
                                </span>
                    </td>
                    <td th:text="${t.lugar}"></td>
                    <td th:text="${t.compromisos}" class="text-wrap" style="max-width: 200px;"></td>
                    <td class="text-center">
                        <a th:href="@{/tutorias/editar/} + ${t.id}" class="btn btn-sm btn-warning me-1">Editar</a>
                        <a th:href="@{/tutorias/eliminar/} + ${t.id}"
                           class="btn btn-sm btn-danger"
                           onclick="return confirm('¿Seguro que deseas eliminar esta tutoría?');">Eliminar</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>

        <div th:if="${tutorias == null or tutorias.empty}" class="alert alert-warning text-center">
            No hay tutorías registradas actualmente.
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

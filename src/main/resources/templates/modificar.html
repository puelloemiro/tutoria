<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Datos del Usuario</title>
    <meta charset="UTF-8">
    <style>
        .error { color: red; font-size: 0.9em; font-weight: bold; }
    </style>
</head>
<body>
<h2>DATOS DEL USUARIO</h2>
<a th:href="@{/}">REGRESAR</a>
<br/><br/>

<form th:action="@{/guardar}" th:object="${usuario}" method="POST">

    <label for="cedula">Cédula:</label>
    <input type="text" th:field="*{cedula}" id="cedula" />
    <span class="error" th:if="${#fields.hasErrors('cedula')}" th:errors="*{cedula}"></span>
    <br/><br/>

    <label for="clave">Clave:</label>
    <input type="password" th:field="*{clave}" id="clave" />
    <span class="error" th:if="${#fields.hasErrors('clave')}" th:errors="*{clave}"></span>
    <br/><br/>

    <label for="nombre">Nombre:</label>
    <input type="text" th:field="*{nombre}" id="nombre" />
    <span class="error" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></span>
    <br/><br/>

    <label for="email">Email:</label>
    <input type="text" th:field="*{email}" id="email" />
    <span class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
    <br/><br/>

    <input type="reset" value="LIMPIAR" />
    <input type="submit" value="GUARDAR" />
</form>
</body>
</html>
